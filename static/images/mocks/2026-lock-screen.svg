  <text x="195" y="134" text-anchor="middle" font-size="19" font-weight="600" fill="#fff" opacity=".85">Tuesday 29 September</text>
  <text x="195" y="232" text-anchor="middle" font-size="104" font-weight="700" fill="#fff" opacity=".95" letter-spacing="-2">9:41</text>
  <!-- Live Activity -->
  <rect x="14" y="560" width="362" height="168" rx="28" fill="#141420" opacity=".82"/>
