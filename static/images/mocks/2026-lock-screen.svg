<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!-- Mock: Lock Screen with the NeverSkip 2 rest-timer Live Activity and Dynamic Island, 2026 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#0A1238"/>
      <stop offset=".55" stop-color="#2A3FA8"/>
      <stop offset="1" stop-color="#7A62E0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".35" r=".6">
      <stop offset="0" stop-color="#668AFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#668AFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="390" height="844" fill="url(#wall)"/>
  <rect width="390" height="844" fill="url(#glow)"/>
  <!-- status bar -->
