  <svg x="34" y="585" width="16" height="12.6" viewBox="162 237 700 550"><defs><mask id="ls-glyph-cut" maskUnits="userSpaceOnUse" x="162" y="237" width="700" height="550">
      <rect x="162" y="237" width="700" height="550" fill="#fff"/>
      <path d="M792 512A280 140 0 0 1 232 512M722 422A210 105 0 0 1 302 422" fill="none" stroke="#000" stroke-width="40"/>
      <ellipse cx="512" cy="342" rx="84" ry="42" fill="#000"/>
    </mask></defs><g fill="#A1A1AA" mask="url(#ls-glyph-cut)"><ellipse cx="512" cy="512" rx="350" ry="175"/><ellipse cx="512" cy="612" rx="350" ry="175"/><rect x="162" y="512" width="700" height="100"/>
    <ellipse cx="512" cy="422" rx="280" ry="140"/><ellipse cx="512" cy="512" rx="280" ry="140"/><rect x="232" y="422" width="560" height="90"/>
    <ellipse cx="512" cy="342" rx="210" ry="105"/><ellipse cx="512" cy="422" rx="210" ry="105"/><rect x="302" y="342" width="420" height="80"/></g></svg>
  <text x="56" y="596" font-size="13" fill="#A1A1AA">Push · Set 3 of 4</text>
